<header class="site-header" data-site-header>
  <div class="shell header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Desmond Kofi Boateng, home">
      <span class="brand-mark" aria-hidden="true">DKB</span>
      <span class="brand-copy">
        <strong>Desmond Kofi Boateng</strong>
        <span>Scientific ML researcher</span>
      </span>
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation" data-nav-toggle>
      <span class="sr-only">Open navigation</span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </button>

    <nav id="primary-navigation" class="primary-nav" aria-label="Primary navigation" data-navigation>
      {% for item in site.data.navigation %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.label }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
